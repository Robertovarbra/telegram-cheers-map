<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Video Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; }
#map { width: 100%; height: 100%; }
.leaflet-popup-content-wrapper { border-radius: 12px; }
.leaflet-popup-content { margin: 10px 14px; max-width: 320px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
.popup-name { font-weight: 600; font-size: 15px; }
.popup-time { color: #666; font-size: 12px; margin-top: 2px; }
.popup-video { display: block; width: 100%; border-radius: 10px; background: #000; }
.popup-scroll .popup-video { height: 200px; object-fit: cover; cursor: pointer; }
.popup-scroll { max-height: 440px; overflow-y: auto; overscroll-behavior: contain; }
.popup-scroll::-webkit-scrollbar { width: 4px; }
.popup-scroll::-webkit-scrollbar-thumb { background: #ccc; border-radius: 2px; }
.popup-entry + .popup-entry { margin-top: 8px; padding-top: 8px; border-top: 1px solid #eee; }
.marker-label { position: absolute; bottom: -16px; left: 50%; transform: translateX(-50%); font-size: 10px; font-weight: 700; color: #333; white-space: nowrap; text-shadow: 0 0 3px #fff, 0 0 3px #fff; }

#filter-toggle {
  position: absolute; top: 10px; right: 10px; z-index: 1000;
  width: 36px; height: 36px; border-radius: 6px; border: 2px solid rgba(0,0,0,0.2);
  background: #fff; cursor: pointer; font-size: 18px; line-height: 32px; text-align: center;
  box-shadow: 0 1px 5px rgba(0,0,0,0.3);
}
#filter-panel {
  position: absolute; top: 52px; right: 10px; z-index: 1000;
  background: #fff; border-radius: 8px; padding: 12px 14px;
  box-shadow: 0 1px 5px rgba(0,0,0,0.3); min-width: 200px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 13px; max-height: calc(100vh - 80px); overflow-y: auto;
}
#filter-panel.hidden { display: none; }
.filter-section { margin-bottom: 10px; }
.filter-section:last-child { margin-bottom: 0; }
.filter-section h4 { font-size: 11px; text-transform: uppercase; color: #888; margin-bottom: 4px; letter-spacing: 0.5px; }
.filter-user { display: flex; align-items: center; gap: 4px; margin: 2px 0; cursor: pointer; }
.filter-user input { margin: 0; }
.filter-user .color-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
.filter-user .emoji-dot { font-size: 14px; line-height: 10px; flex-shrink: 0; }
.filter-user label { cursor: pointer; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.filter-date { display: flex; align-items: center; gap: 4px; }
.filter-date input { flex: 1; font-size: 12px; border: 1px solid #ccc; border-radius: 4px; padding: 2px 4px; }
.filter-clear { color: #e74c3c; cursor: pointer; font-size: 11px; display: inline-block; margin-top: 2px; }
.filter-count { font-size: 11px; color: #888; margin-top: 6px; padding-top: 6px; border-top: 1px solid #eee; }
#filter-bounds { vertical-align: middle; }
#user-filters { max-height: 95px; overflow-y: auto; }
</style>
</head>
<body>
<div id="map"></div>
<div id="filter-toggle" title="Toggle filters">🔽</div>
<div id="filter-panel" class="hidden">
  <div class="filter-section">
    <h4>Users <span class="filter-select-all" style="font-size:11px;text-transform:none;cursor:pointer;color:#3498db;">All</span> <span class="filter-select-none" style="font-size:11px;text-transform:none;cursor:pointer;color:#888;">None</span></h4>
    <div id="user-filters"></div>
  </div>
  <div class="filter-section">
    <h4>Location</h4>
    <input type="text" id="filter-location" placeholder="City or country..." style="width:100%;font-size:12px;border:1px solid #ccc;border-radius:4px;padding:3px 5px;margin-bottom:2px;">
    <span class="filter-clear" id="location-clear">Clear</span>
    <label style="display:block;margin-top:4px;"><input type="checkbox" id="filter-bounds"> Only in map view</label>
  </div>
  <div class="filter-section">
    <h4>Date</h4>
    <div class="filter-date">
      <input type="date" id="date-from"> <span>—</span> <input type="date" id="date-to">
    </div>
    <span class="filter-clear" id="date-clear">Clear dates</span>
  </div>
  <div class="filter-count" id="filter-count"></div>
</div>
<script>
const params = new URLSearchParams(window.location.search);
const chatId = params.get('chat_id');
if (!chatId) {
  document.body.innerHTML = '<div style="padding:20px;text-align:center;color:#999">Missing chat ID</div>';
  throw new Error('chat_id required');
}

const map = L.map('map').setView([0, 0], 2);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://osm.org/copyright">OpenStreetMap</a>',
  maxZoom: 19,
}).addTo(map);

var allPins = [];
var markerGroup = L.layerGroup().addTo(map);
var userColors = {};
var GROUP_RADIUS = 10;

function toRad(d) { return d * Math.PI / 180; }

function haversineDistance(lat1, lon1, lat2, lon2) {
  var R = 6371000;
  var dLat = toRad(lat2 - lat1);
  var dLon = toRad(lon2 - lon1);
  var a = Math.sin(dLat/2) * Math.sin(dLat/2) +
          Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
          Math.sin(dLon/2) * Math.sin(dLon/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function getColor(uid, customColor) {
  if (customColor) return customColor;
  var pal = ['#e74c3c','#3498db','#2ecc71','#f39c12','#9b59b6','#1abc9c','#e67e22','#34495e','#e91e63','#00bcd4'];
  if (!userColors[uid]) userColors[uid] = pal[Math.abs(uid) % pal.length];
  return userColors[uid];
}

function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

fetch('/api/pins?chat_id=' + encodeURIComponent(chatId))
  .then(function(r) { if (!r.ok) throw new Error('Failed'); return r.json(); })
  .then(function(pins) {
    allPins = pins;
    if (pins.length === 0) return;
    populateFilters(pins);
    renderMarkers();
  })
  .catch(function(e) { console.error('Map error:', e); });

function populateFilters(pins) {
  var userMap = {};
  var minDate = '', maxDate = '';
  pins.forEach(function(p) {
    if (!userMap[p.user_id]) {
      userMap[p.user_id] = { name: p.user_name, color: getColor(p.user_id, p.pin_color), emoji: p.pin_emoji };
    }
    var d = p.created_at.split('T')[0];
    if (!minDate || d < minDate) minDate = d;
    if (!maxDate || d > maxDate) maxDate = d;
  });
  var sorted = Object.keys(userMap).sort(function(a, b) { return userMap[a].name.localeCompare(userMap[b].name); });
  var html = '';
  sorted.forEach(function(uid) {
    var u = userMap[uid];
    var dot = u.emoji ? '<span class="emoji-dot">' + u.emoji + '</span>' : '<span class="color-dot" style="background:' + u.color + '"></span>';
    html += '<div class="filter-user"><input type="checkbox" class="filter-user-cb" value="' + uid + '" checked>' +
      dot +
      '<label>' + esc(u.name) + '</label></div>';
  });
  document.getElementById('user-filters').innerHTML = html;
  document.getElementById('user-filters').addEventListener('change', scheduleRender);

  document.querySelector('.filter-select-all').addEventListener('click', function() {
    document.querySelectorAll('.filter-user-cb').forEach(function(cb) { cb.checked = true; });
    scheduleRender();
  });
  document.querySelector('.filter-select-none').addEventListener('click', function() {
    document.querySelectorAll('.filter-user-cb').forEach(function(cb) { cb.checked = false; });
    scheduleRender();
  });

  document.getElementById('date-from').value = '';
  document.getElementById('date-to').value = '';
  document.getElementById('date-from').min = minDate;
  document.getElementById('date-from').max = maxDate;
  document.getElementById('date-to').min = minDate;
  document.getElementById('date-to').max = maxDate;
  document.getElementById('date-from').addEventListener('change', scheduleRender);
  document.getElementById('date-to').addEventListener('change', scheduleRender);
  document.getElementById('date-clear').addEventListener('click', function() {
    document.getElementById('date-from').value = '';
    document.getElementById('date-to').value = '';
    scheduleRender();
  });

  document.getElementById('filter-bounds').addEventListener('change', function() {
    if (this.checked) {
      map.on('moveend', onMapMove);
    } else {
      map.off('moveend', onMapMove);
    }
    scheduleRender();
  });

  document.getElementById('filter-location').addEventListener('input', scheduleRender);
  document.getElementById('location-clear').addEventListener('click', function() {
    document.getElementById('filter-location').value = '';
    scheduleRender();
  });

  document.getElementById('filter-toggle').addEventListener('click', function() {
    var p = document.getElementById('filter-panel');
    p.classList.toggle('hidden');
    this.textContent = p.classList.contains('hidden') ? '🔽' : '🔼';
  });
}

var renderTimer = null;
function scheduleRender() {
  if (renderTimer) clearTimeout(renderTimer);
  renderTimer = setTimeout(renderMarkers, 500);
}

function onMapMove() {
  scheduleRender();
}

function getFilteredPins() {
  var selected = {};
  document.querySelectorAll('.filter-user-cb:checked').forEach(function(cb) { selected[cb.value] = true; });
  var dateFrom = document.getElementById('date-from').value;
  var dateTo = document.getElementById('date-to').value;
  var boundsOnly = document.getElementById('filter-bounds').checked;
  var bounds = boundsOnly ? map.getBounds() : null;
  var locText = document.getElementById('filter-location').value.trim().toLowerCase();

  return allPins.filter(function(p) {
    if (!selected[p.user_id]) return false;
    if (dateFrom && p.created_at < dateFrom) return false;
    if (dateTo && p.created_at.split('T')[0] > dateTo) return false;
    if (bounds && !bounds.contains([p.latitude, p.longitude])) return false;
    if (locText) {
      var city = (p.city || '').toLowerCase();
      var country = (p.country || '').toLowerCase();
      var code = (p.country_code || '').toLowerCase();
      if (city.indexOf(locText) === -1 && country.indexOf(locText) === -1 && code.indexOf(locText) === -1) return false;
    }
    return true;
  });
}

function renderMarkers() {
  markerGroup.clearLayers();
  var filtered = getFilteredPins();
  if (filtered.length === 0) {
    document.getElementById('filter-count').textContent = '0 pins match filters';
    return;
  }
  var groups = {};
  filtered.forEach(function(p) {
    var found = false;
    for (var k in groups) {
      if (haversineDistance(groups[k].lat, groups[k].lng, p.latitude, p.longitude) <= GROUP_RADIUS) {
        groups[k].pins.push(p);
        groups[k].lat = (groups[k].lat * (groups[k].pins.length - 1) + p.latitude) / groups[k].pins.length;
        groups[k].lng = (groups[k].lng * (groups[k].pins.length - 1) + p.longitude) / groups[k].pins.length;
        found = true;
        break;
      }
    }
    if (!found) {
      groups[p.latitude + ',' + p.longitude] = { lat: p.latitude, lng: p.longitude, pins: [p] };
    }
  });
  var bounds = [];
  for (var k in groups) {
    var g = groups[k];
    bounds.push([g.lat, g.lng]);
    if (g.pins.length === 1) {
      addMarker(g.lat, g.lng, g.pins[0]);
    } else {
      addGroupMarker(g.lat, g.lng, g.pins);
    }
  }
  if (bounds.length) map.fitBounds(bounds, { padding: [40, 40], maxZoom: 15 });
  document.getElementById('filter-count').textContent = filtered.length + ' of ' + allPins.length + ' pins shown';
}

function addMarker(lat, lng, p) {
  var c = getColor(p.user_id, p.pin_color);
  var icon;
  if (p.pin_emoji) {
    icon = L.divIcon({
      className: '',
      html: '<div style="width:36px;height:36px;font-size:28px;line-height:36px;text-align:center;text-shadow:0 1px 3px rgba(0,0,0,0.3);">' + p.pin_emoji + '</div><div class="marker-label">' + esc(p.user_name.split(' ')[0]) + '</div>',
      iconSize: [36, 36],
      iconAnchor: [18, 36],
      popupAnchor: [0, -36],
    });
  } else {
    icon = L.divIcon({
      className: '',
      html: '<svg width="28" height="42" viewBox="0 0 28 42"><path d="M14 0C7 0 2 5 2 11c0 8 12 19 12 19s12-11 12-19c0-6-5-11-12-11z" fill="' + c + '" stroke="#fff" stroke-width="2"/><circle cx="14" cy="11" r="5" fill="#fff"/></svg><div class="marker-label">' + esc(p.user_name.split(' ')[0]) + '</div>',
      iconSize: [28, 42],
      iconAnchor: [14, 42],
      popupAnchor: [0, -42],
    });
  }
  markerGroup.addLayer(L.marker([lat, lng], { icon: icon }).bindPopup(
    '<div class="popup-name">' + esc(p.user_name) + '</div>' +
    (p.city || p.country ? '<div class="popup-time">' + [p.city, p.country].filter(Boolean).join(', ') + (p.country_code ? ' (' + p.country_code + ')' : '') + '</div>' : '') +
    '<div class="popup-time">' + new Date(p.created_at).toLocaleString() + '</div>' +
    '<video class="popup-video" src="/api/video?file_id=' + p.video_file_id + '" controls preload="metadata" playsinline></video>'
  ));
}

function addGroupMarker(lat, lng, pins) {
  var allSame = pins.every(function(p) { return p.user_id === pins[0].user_id; });
  var c, topEmoji;

  if (allSame && pins[0].pin_emoji) {
    c = getColor(pins[0].user_id, pins[0].pin_color);
    topEmoji = pins[0].pin_emoji;
  } else {
    if (allSame) {
      c = getColor(pins[0].user_id, pins[0].pin_color);
    } else {
      var userData = {};
      pins.forEach(function(p) {
        if (!userData[p.user_id]) {
          userData[p.user_id] = { count: 0, color: getColor(p.user_id, p.pin_color) };
        }
        userData[p.user_id].count++;
      });
      var entries = Object.keys(userData).map(function(uid) { return userData[uid]; });
      var total = pins.length;
      var pct = 0;
      var stops = entries.map(function(e) {
        var seg = (e.count / total) * 100;
        var p1 = Math.round(pct * 10) / 10;
        pct += seg;
        var p2 = Math.round(pct * 10) / 10;
        return e.color + ' ' + p1 + '% ' + p2 + '%';
      }).join(', ');
      c = 'conic-gradient(' + stops + ')';
    }
    var emojiCounts = {};
    pins.forEach(function(p) {
      if (p.pin_emoji) emojiCounts[p.pin_emoji] = (emojiCounts[p.pin_emoji] || 0) + 1;
    });
    var sorted = Object.keys(emojiCounts).sort(function(a, b) { return emojiCounts[b] - emojiCounts[a]; });
    if (sorted.length > 0) topEmoji = sorted[0];
  }

  var content;
  if (topEmoji) {
    var fontSize = (allSame && pins[0].pin_emoji) ? '18px' : '16px';
    var badge = '<span style="position:absolute;bottom:-2px;right:0;color:#fff;font-size:10px;font-weight:700;text-shadow:0 0 4px rgba(0,0,0,0.8);">' + pins.length + '</span>';
    content = '<div style="position:relative;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:' + c + ';border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.3);">' +
      '<span style="font-size:' + fontSize + ';">' + topEmoji + '</span>' +
      ((allSame && pins[0].pin_emoji && pins.length === 1) ? '' : badge) +
      '</div>';
  } else {
    content = '<div style="width:36px;height:36px;border-radius:50%;background:' + c + ';color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.3);">' + pins.length + '</div>';
  }

  var icon = L.divIcon({
    className: '',
    html: content,
    iconSize: [36, 36],
    iconAnchor: [18, 18],
    popupAnchor: [0, -18],
  });
  var marker = L.marker([lat, lng], { icon: icon });
  var html = '<div class="popup-scroll">';
  pins.forEach(function(p) {
    var nameColor = getColor(p.user_id, p.pin_color);
    var loc = [p.city, p.country].filter(Boolean).join(', ');
    if (p.country_code) loc += ' (' + p.country_code + ')';
    html += '<div class="popup-entry"><div class="popup-name" style="color:' + nameColor + ';">' + (p.pin_emoji || '●') + ' ' + esc(p.user_name) + '</div>' +
      (loc ? '<div class="popup-time">' + esc(loc) + '</div>' : '') +
      '<div class="popup-time">' + new Date(p.created_at).toLocaleString() + '</div>' +
      '<video class="popup-video" data-file-id="' + p.video_file_id + '" controls preload="none" playsinline></video></div>';
  });
  html += '</div>';
  marker.bindPopup(html);
  markerGroup.addLayer(marker);
}

document.addEventListener('click', function(e) {
  var v = e.target.closest('video[data-file-id]');
  if (v && !v.src) {
    v.src = '/api/video?file_id=' + v.dataset.fileId;
    v.removeAttribute('data-file-id');
    v.play();
  }
}, true);
</script>
</body>
</html>
