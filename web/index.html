<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Video Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; }
#map { width: 100%; height: 100%; }
.leaflet-popup-content-wrapper { border-radius: 12px; }
.leaflet-popup-content { margin: 12px 16px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
.popup-name { font-weight: 600; font-size: 15px; }
.popup-time { color: #666; font-size: 12px; margin-top: 2px; }
.marker-label { position: absolute; bottom: -16px; left: 50%; transform: translateX(-50%); font-size: 10px; font-weight: 700; color: #333; white-space: nowrap; text-shadow: 0 0 3px #fff, 0 0 3px #fff; }
.popup-btn { display: block; margin-top: 10px; padding: 10px 0; text-align: center; background: #2ea6ff; color: #fff; text-decoration: none; border-radius: 10px; font-weight: 500; font-size: 14px; }
</style>
</head>
<body>
<div id="map"></div>
<script>
const params = new URLSearchParams(window.location.search);
const chatId = params.get('chat_id');
if (!chatId) {
  document.body.innerHTML = '<div style="padding:20px;text-align:center;color:#999">Missing chat ID</div>';
  throw new Error('chat_id required');
}

const map = L.map('map').setView([0, 0], 2);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://osm.org/copyright">OpenStreetMap</a>',
  maxZoom: 19,
}).addTo(map);

var bounds = [];
var groups = {};
var userColors = {};

function getColor(uid) {
  var pal = ['#e74c3c','#3498db','#2ecc71','#f39c12','#9b59b6','#1abc9c','#e67e22','#34495e','#e91e63','#00bcd4'];
  if (!userColors[uid]) userColors[uid] = pal[Math.abs(uid) % pal.length];
  return userColors[uid];
}

function chatLink(p) {
  if (p.video_link) return p.video_link;
  return 'tg://openmessage?chat_id=' + chatId + '&message_id=' + p.message_id;
}

fetch('/api/pins?chat_id=' + encodeURIComponent(chatId))
  .then(function(r) { if (!r.ok) throw new Error('Failed'); return r.json(); })
  .then(function(pins) {
    if (pins.length === 0) return;
    pins.forEach(function(p) {
      var key = Math.round(p.latitude * 10000) + ',' + Math.round(p.longitude * 10000);
      if (!groups[key]) groups[key] = { lat: p.latitude, lng: p.longitude, pins: [] };
      groups[key].pins.push(p);
    });
    for (var k in groups) {
      var g = groups[k];
      bounds.push([g.lat, g.lng]);
      if (g.pins.length === 1) {
        var p = g.pins[0];
        addMarker(g.lat, g.lng, p);
      } else {
        addGroupMarker(g.lat, g.lng, g.pins);
      }
    }
    if (bounds.length) map.fitBounds(bounds, { padding: [40, 40], maxZoom: 15 });
  })
  .catch(function(e) { console.error('Map error:', e); });

function addMarker(lat, lng, p) {
  var cl = chatLink(p);
  var c = getColor(p.user_id);
  var icon = L.divIcon({
    className: '',
    html: '<svg width="28" height="42" viewBox="0 0 28 42"><path d="M14 0C7 0 2 5 2 11c0 8 12 19 12 19s12-11 12-19c0-6-5-11-12-11z" fill="' + c + '" stroke="#fff" stroke-width="2"/><circle cx="14" cy="11" r="5" fill="#fff"/></svg><div class="marker-label">' + esc(p.user_name.split(' ')[0]) + '</div>',
    iconSize: [28, 42],
    iconAnchor: [14, 42],
    popupAnchor: [0, -42],
  });
  L.marker([lat, lng], { icon: icon }).addTo(map).bindPopup(
    '<div class="popup-name">' + esc(p.user_name) + '</div>' +
    '<div class="popup-time">' + new Date(p.created_at).toLocaleString() + '</div>' +
    '<a class="popup-btn" href="' + cl + '" target="_blank">▶ Watch Video</a>'
  );
}

function addGroupMarker(lat, lng, pins) {
  var allSame = pins.every(function(p) { return p.user_id === pins[0].user_id; });
  var c = allSame ? getColor(pins[0].user_id) : '#7f8c8d';
  var icon = L.divIcon({
    className: '',
    html: '<div style="width:36px;height:36px;border-radius:50%;background:' + c + ';color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.3);">' + pins.length + '</div>',
    iconSize: [36, 36],
    iconAnchor: [18, 18],
    popupAnchor: [0, -18],
  });
  var html = '';
  pins.forEach(function(p) {
    var cl = chatLink(p);
    html += '<div style="margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid #eee;">' +
      '<div class="popup-name" style="color:' + getColor(p.user_id) + ';">● ' + esc(p.user_name) + '</div>' +
      '<div class="popup-time">' + new Date(p.created_at).toLocaleString() + '</div>' +
      '<a class="popup-btn" href="' + cl + '" target="_blank">▶ Watch Video</a></div>';
  });
  L.marker([lat, lng], { icon: icon }).addTo(map).bindPopup(html);
}

function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
</script>
</body>
</html>
