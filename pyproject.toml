[project]
name = "telegram-cheers-map"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "python-telegram-bot>=21.10",
    "aiohttp>=3.11.12",
    "python-dotenv>=1.1.0",
    "pillow>=11.0.0,<11.1.0",
]

[[tool.uv.index]]
name = "piwheels"
url = "https://www.piwheels.org/simple"
explicit = true

[tool.uv.sources]
pillow = [
    { index = "piwheels", marker = "sys_platform == 'linux' and (platform_machine == 'armv6l' or platform_machine == 'armv7l')" },
]

[project.optional-dependencies]
dev = ["ruff>=0.11"]

[tool.ruff]
target-version = "py39"
line-length = 160
exclude = [".git", "web"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "N"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[dependency-groups]
dev = [
    "ruff>=0.15.14",
]
